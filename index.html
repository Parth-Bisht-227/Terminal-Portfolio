
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parth Bisht | Neural Command Center</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;rect width='100' height='100' rx='22' fill='%23050505'/&gt;&lt;path d='M32 30 L58 50 L32 70' fill='none' stroke='%2300F0FF' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/&gt;&lt;line x1='62' y1='70' x2='82' y2='70' stroke='%2339FF14' stroke-width='12' stroke-linecap='round'/&gt;&lt;/svg&gt;" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              cyber: {
                cyan: '#00F0FF',
                green: '#39FF14',
                purple: '#BC13FE',
                amber: '#FFB100',
                darkCyan: '#0891b2',
                darkGreen: '#16a34a',
                darkPurple: '#7c3aed',
                darkAmber: '#d97706',
              }
            }
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'JetBrains Mono', monospace;
        transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(128, 128, 128, 0.2);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(128, 128, 128, 0.4);
      }
      
      .shimmer {
        background: linear-gradient(90deg, #0891b2 0%, #7c3aed 50%, #0891b2 100%);
        background-size: 200% auto;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 3s linear infinite;
      }
      .dark .shimmer {
        background: linear-gradient(90deg, #fff 0%, #00F0FF 50%, #fff 100%);
        background-size: 200% auto;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      
      @keyframes shine {
        to { background-position: 200% center; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }
      
      .glass {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
      }
      .dark .glass {
        background: rgba(10, 10, 10, 0.75);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      }
      
      /* Theme-aware Neon Text Helpers */
      .neon-cyan { color: #0891b2; }
      .dark .neon-cyan { color: #00F0FF; text-shadow: 0 0 8px rgba(0, 240, 255, 0.3); }
      
      .neon-green { color: #16a34a; }
      .dark .neon-green { color: #39FF14; text-shadow: 0 0 8px rgba(57, 255, 20, 0.3); }
      
      .neon-purple { color: #7c3aed; }
      .dark .neon-purple { color: #BC13FE; text-shadow: 0 0 8px rgba(188, 19, 254, 0.3); }
      
      .neon-amber { color: #d97706; }
      .dark .neon-amber { color: #FFB100; text-shadow: 0 0 8px rgba(255, 177, 0, 0.3); }
    </style>
</head>
  <body class="dark overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
